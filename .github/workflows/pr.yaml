name: PR

on:
  pull_request:
    paths-ignore:
    - .editorconfig
    - .gitattributes
    - .gitignore
    - CHANGELOG.md
    - LICENSE.md
    - README.md

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml
