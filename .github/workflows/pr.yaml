name: PR

on:
  pull_request:
    paths-ignore:
    - .editorconfig
    - .gitattributes
    - .gitignore
    - .prettierignore
    - action.yaml
    - CHANGELOG.md
    - LICENSE.md
    - README.md

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        cache: npm
        cache-dependency-path: package-lock.json
        node-version: 24.x
    - name: Install dependencies
      run: npm ci
    - name: Check formatting
      run: npm run fmt:check
    - name: Run unit tests
      run: npm run test
