name: CI

on:
  push:
    branches:
    - main
    paths-ignore:
    - .editorconfig
    - .gitattributes
    - .gitignore
    - CHANGELOG.md
    - LICENSE.md
    - README.md

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml

  release:
    name: Release?
    needs: [ verify ]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@b40ef8e1b220c86892199cb32e2d65d392e74e34 # v0.4.1

  tag:
    name: Tag?
    needs: [ release ]
    if: needs.release.outputs.release-created == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - name: Move the major version tag to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ needs.release.outputs.tag-name }}
      run: |
        if [[ ! "${TAG_NAME}" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
          echo "Skipping, ${TAG_NAME} is not a stable release."
          exit 0
        fi

        major="${BASH_REMATCH[1]}"
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" --silent 2>/dev/null; then
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
            --method PATCH --silent --raw-field "sha=${GITHUB_SHA}" --field force=true
        else
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            --method POST --silent --raw-field "ref=refs/tags/${major}" --raw-field "sha=${GITHUB_SHA}"
        fi

        echo "Moved ${major} to ${GITHUB_SHA} (${TAG_NAME})."
