name: Setup Grafana Tanka
description: Installs Grafana Tanka in GitHub Actions.
author: Daniel Morris
branding:
  color: orange
  icon: anchor
inputs:
  tanka-version:
    default: 0.36.3
    description: Grafana Tanka version.
    required: false
  token:
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
    description: >-
      Token used to read the Grafana Tanka release from the github.com API in
      order to verify the download. Defaults to the workflow token on
      github.com, and to unauthenticated requests elsewhere.
    required: false
outputs:
  cache-hit:
    description: Whether Grafana Tanka was found in the runner tool cache.
  tanka-version:
    description: The version of Grafana Tanka that was installed.
runs:
  main: dist/index.js
  using: node24
